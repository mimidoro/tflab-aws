apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: { app: api }
spec:
  replicas: {{ .Values.api.minReplicas }}
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      serviceAccountName: api
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: api }
      containers:
        - name: api
          image: {{ .Values.image.api }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: REGION_LABEL, value: {{ .Values.regionLabel | quote }} }
            - { name: IS_PRIMARY_REGION, value: {{ .Values.isPrimary | quote }} }
            - { name: AWS_REGION, value: {{ .Values.awsRegion | quote }} }
            - { name: DB_HOST, value: {{ .Values.db.host | quote }} }
            - { name: DB_NAME, value: {{ .Values.db.name | quote }} }
            - { name: DB_USER, value: {{ .Values.db.user | quote }} }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          # Readiness = process up. Database health is exposed separately on /api/ready,
          # which Route 53 uses to decide regional failover.
          readinessProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            periodSeconds: 10
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: NodePort
  selector: { app: api }
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: {{ .Values.api.nodePort }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: {{ .Values.api.minReplicas }}
  maxReplicas: {{ .Values.api.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: api }
