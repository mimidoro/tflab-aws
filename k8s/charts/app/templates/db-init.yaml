{{- if .Values.isPrimary }}
# Runs BEFORE the API on install/upgrade (Helm pre-hook). Reads the RDS-managed master secret
# via Pod Identity, then idempotently creates the tflab_api role (IAM auth, no password) and the
# schema. The replica in Melbourne receives both through replication.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-init
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels: { app: db-init }
    spec:
      serviceAccountName: db-init
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: db-init
          image: {{ .Values.image.api }}
          args: ["--db-init"]
          env:
            - { name: AWS_REGION, value: {{ .Values.awsRegion | quote }} }
            - { name: DB_HOST, value: {{ .Values.db.host | quote }} }
            - { name: DB_NAME, value: {{ .Values.db.name | quote }} }
            - { name: DB_USER, value: {{ .Values.db.user | quote }} }
            - { name: DB_MASTER_SECRET_ARN, value: {{ .Values.db.masterSecretArn | quote }} }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
